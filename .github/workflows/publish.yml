name: Publicar novo post

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar próximo(s) post(s) do backlog
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_POSTS_PER_DIA: ${{ secrets.MAX_POSTS_PER_DIA }}
        run: python generate_post.py

      - name: Buildar site
        run: python site_builder/build.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts pipeline/topics_backlog.yaml docs
          git diff --cached --quiet && echo "Nada novo para commitar." || \
            git commit -m "Publica novo post automático"
          git push
